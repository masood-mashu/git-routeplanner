name: "dispatch-window-solver"
description: "Verifies that scheduled stop arrival times fall within customer receiving hours"
version: "0.1.0"
runtime:
  language: "python"
  entrypoint: "dispatch_window_solver.py"
parameters:
  type: "object"
  properties:
    windows_json:
      type: "string"
      description: "JSON list of stops with arrival_hour, open_hour, close_hour"
  required:
    - "windows_json"
