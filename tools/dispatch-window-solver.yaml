name: dispatch-window-solver
version: 1.0.0
description: "Verifies that scheduled stop arrival times fall within customer receiving hours"
input_schema:
  type: object
  properties:
    windows_json:
      type: string
      description: "JSON list of stops with arrival_hour, open_hour, close_hour"
  required:
    - windows_json
implementation:
  type: script
  path: dispatch_window_solver.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
